<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مگالودون | ساعت دیجیتال جهانی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0806;
    --bg2:#120d09;
    --panel:#17110b;
    --panel2:#1c150e;
    --border:#2c2115;
    --border2:#3a2c1a;
    --gold:#e3a84c;
    --gold2:#f6c877;
    --gold-dim:#8a6a34;
    --text:#f3e9db;
    --muted:#a4917a;
    --muted2:#6e5d47;
    --green:#20d193;
    --green-dim:#123527;
    --red:#f6465d;
    --red-dim:#3a1620;
    --blue:#4a9eff;
    --blue-dim:#1a3a5a;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at top left, #1a1108 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    font-size:14px;
    line-height:1.6;
    display:flex;
    flex-direction:column;
  }
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2); border-radius:8px;}

  /* Header */
  header{
    background:linear-gradient(180deg,var(--panel),#100b07);
    border-bottom:1px solid var(--border);
    padding:16px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .logo{display:flex; align-items:center; gap:12px;}
  .logo .mark{
    width:40px; height:40px; border-radius:10px;
    background:linear-gradient(145deg,var(--gold2),var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#1a1108; font-size:20px;
    box-shadow:0 0 0 1px #00000055, 0 4px 14px -4px #e3a84c66;
  }
  .logo .name{font-weight:800; font-size:22px; letter-spacing:.2px;}
  .logo .sub{font-size:11px; color:var(--muted2);}

  nav{display:flex; gap:24px;}
  nav a{
    color:var(--muted);
    text-decoration:none;
    font-weight:500;
    font-size:14px;
    transition:.15s;
    padding:8px 12px;
    border-radius:6px;
  }
  nav a:hover{color:var(--gold2); background:#ffffff08;}
  nav a.active{color:var(--gold2); background:linear-gradient(90deg,#e3a84c22,#e3a84c08);}

  .nav-right{display:flex; gap:12px; align-items:center;}
  .btn{
    padding:10px 20px;
    border-radius:8px;
    font-weight:600;
    font-size:13px;
    border:none;
    cursor:pointer;
    transition:.15s;
  }
  .btn-primary{background:linear-gradient(90deg,var(--gold2),var(--gold)); color:#1a1108;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{background:transparent; border:1px solid var(--border2); color:var(--muted);}
  .btn-secondary:hover{border-color:var(--gold); color:var(--gold2);}

  /* Main Container */
  .container{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:40px 20px;
    max-width:1400px;
    margin:0 auto;
    width:100%;
    gap:40px;
  }

  /* Header Section */
  .clock-header{
    text-align:center;
  }
  .clock-header h1{
    font-size:48px;
    font-weight:800;
    margin-bottom:12px;
    background:linear-gradient(90deg,var(--gold2),var(--gold-dim));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .clock-header p{
    font-size:16px;
    color:var(--muted);
  }

  /* Primary Clock */
  .primary-clock{
    text-align:center;
    margin-bottom:40px;
  }

  .clock-display{
    font-family:'JetBrains Mono',monospace;
    font-size:96px;
    font-weight:800;
    color:var(--gold2);
    text-shadow:0 0 30px #e3a84c66;
    margin-bottom:16px;
    letter-spacing:4px;
    animation:pulse 1s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100%{text-shadow:0 0 30px #e3a84c66;}
    50%{text-shadow:0 0 50px #e3a84c99;}
  }

  .clock-info{
    font-size:18px;
    color:var(--muted);
    margin-bottom:8px;
  }

  .clock-date{
    font-size:14px;
    color:var(--muted2);
  }

  /* Time Zones Grid */
  .timezones-section{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:20px;
  }

  .timezone-card{
    background:linear-gradient(135deg, var(--panel2), var(--panel));
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px;
    transition:.3s;
    position:relative;
    overflow:hidden;
  }

  .timezone-card::before{
    content:'';
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:linear-gradient(90deg,var(--gold2),var(--gold-dim),transparent);
  }

  .timezone-card:hover{
    border-color:var(--gold);
    box-shadow:0 0 30px #e3a84c22;
    transform:translateY(-4px);
  }

  .timezone-label{
    font-size:12px;
    color:var(--muted2);
    text-transform:uppercase;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:8px;
  }

  .timezone-city{
    font-size:20px;
    font-weight:800;
    color:var(--gold2);
    margin-bottom:12px;
  }

  .timezone-time{
    font-family:'JetBrains Mono',monospace;
    font-size:36px;
    font-weight:800;
    color:var(--text);
    margin-bottom:8px;
    letter-spacing:2px;
  }

  .timezone-period{
    font-size:12px;
    color:var(--muted);
    margin-bottom:12px;
  }

  .timezone-details{
    display:flex;
    justify-content:space-between;
    padding-top:12px;
    border-top:1px solid var(--border);
    font-size:11px;
    color:var(--muted2);
  }

  .tz-offset{
    font-weight:700;
    color:var(--gold2);
  }

  /* Add Timezone Section */
  .add-timezone-section{
    background:linear-gradient(135deg, var(--panel2), var(--panel));
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px;
  }

  .section-title{
    font-size:18px;
    font-weight:800;
    color:var(--gold2);
    margin-bottom:20px;
  }

  .add-form{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }

  .add-form select,
  .add-form input{
    padding:12px;
    background:var(--panel);
    border:1px solid var(--border2);
    color:var(--text);
    border-radius:8px;
    font-family:inherit;
    flex:1;
    min-width:180px;
  }

  .add-form select:focus,
  .add-form input:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 8px #e3a84c33;
  }

  .add-form select option{
    background:var(--bg);
    color:var(--text);
  }

  .add-btn{
    padding:12px 24px;
    background:linear-gradient(90deg,var(--gold2),var(--gold));
    color:#1a1108;
    border:none;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
  }

  .add-btn:hover{filter:brightness(1.08);}
  .add-btn:disabled{filter:brightness(0.7); cursor:not-allowed;}

  /* Settings */
  .settings-section{
    background:linear-gradient(135deg, var(--panel2), var(--panel));
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px;
  }

  .settings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:20px;
  }

  .setting-item{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .setting-label{
    font-size:12px;
    color:var(--muted2);
    text-transform:uppercase;
    font-weight:700;
  }

  .toggle{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .toggle-switch{
    width:50px;
    height:26px;
    background:var(--border2);
    border-radius:13px;
    cursor:pointer;
    position:relative;
    transition:.3s;
  }

  .toggle-switch.active{
    background:var(--green);
  }

  .toggle-switch::after{
    content:'';
    position:absolute;
    width:22px;
    height:22px;
    background:white;
    border-radius:50%;
    top:2px;
    left:2px;
    transition:.3s;
  }

  .toggle-switch.active::after{
    left:26px;
  }

  /* Stats */
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:16px;
    margin-top:20px;
  }

  .stat-item{
    background:var(--bg2);
    border:1px solid var(--border);
    padding:16px;
    border-radius:8px;
    text-align:center;
  }

  .stat-value{
    font-size:24px;
    font-weight:800;
    color:var(--gold2);
    font-family:'JetBrains Mono',monospace;
  }

  .stat-label{
    font-size:11px;
    color:var(--muted2);
    text-transform:uppercase;
    margin-top:4px;
    font-weight:600;
  }

  /* Remove Button */
  .remove-btn{
    position:absolute;
    top:12px;
    right:12px;
    background:var(--red-dim);
    border:1px solid var(--red);
    color:var(--red);
    width:28px;
    height:28px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    opacity:0;
    transition:.15s;
  }

  .timezone-card:hover .remove-btn{
    opacity:1;
  }

  .remove-btn:hover{
    background:var(--red);
    color:white;
  }

  @media (max-width:768px){
    header{padding:12px 20px;}
    .clock-display{font-size:56px;}
    .clock-header h1{font-size:32px;}
    .timezones-section{grid-template-columns:1fr;}
    .add-form{flex-direction:column;}
    .add-form select,
    .add-form input{min-width:auto;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="mark">🕐</div>
    <div>
      <div class="name">مگالودون</div>
      <div class="sub">ساعت جهانی</div>
    </div>
  </div>
  <nav>
    <a href="index.html">خانه</a>
    <a href="chart.html">چارت</a>
    <a href="joke.html">لطیفه</a>
    <a href="clock.html" class="active">ساعت</a>
  </nav>
  <div class="nav-right">
    <button class="btn btn-secondary">ورود</button>
    <button class="btn btn-primary">ثبت‌نام</button>
  </div>
</header>

<div class="container">
  <div class="clock-header">
    <h1>⏰ ساعت جهانی</h1>
    <p>زمان دقیق در تمام منطقه‌های جهانی</p>
  </div>

  <!-- Primary Clock -->
  <div class="primary-clock">
    <div class="clock-display" id="primaryClock">00:00:00</div>
    <div class="clock-info" id="primaryInfo">--</div>
    <div class="clock-date" id="primaryDate">--</div>
  </div>

  <!-- Time Zones Grid -->
  <div class="timezones-section" id="timezonesGrid"></div>

  <!-- Add Timezone -->
  <div class="add-timezone-section">
    <div class="section-title">➕ اضافه کردن منطقه زمانی</div>
    <div class="add-form">
      <select id="timezoneSelect">
        <option value="">انتخاب منطقه زمانی...</option>
      </select>
      <input type="text" id="cityName" placeholder="نام شهر (اختیاری)">
      <button class="add-btn" id="addBtn">اضافه کنید</button>
    </div>
    <div class="stats" id="statsContainer"></div>
  </div>

  <!-- Settings -->
  <div class="settings-section">
    <div class="section-title">⚙️ تنظیمات</div>
    <div class="settings-grid">
      <div class="setting-item">
        <div class="setting-label">فرمت 24 ساعته</div>
        <div class="toggle">
          <div class="toggle-switch active" id="toggle24h"></div>
          <span id="toggle24hLabel">فعال</span>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">نمایش ثانیه</div>
        <div class="toggle">
          <div class="toggle-switch active" id="toggleSeconds"></div>
          <span id="toggleSecondsLabel">فعال</span>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">نمایش تاریخ</div>
        <div class="toggle">
          <div class="toggle-switch active" id="toggleDate"></div>
          <span id="toggleDateLabel">فعال</span>
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">نمایش offset</div>
        <div class="toggle">
          <div class="toggle-switch active" id="toggleOffset"></div>
          <span id="toggleOffsetLabel">فعال</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== State ====================
const state = {
  is24h: true,
  showSeconds: true,
  showDate: true,
  showOffset: true,
  timezones: [
    {id: 1, tz: 'Asia/Tehran', city: 'تهران', offset: '+0330'},
    {id: 2, tz: 'UTC', city: 'لندن', offset: '+0000'},
    {id: 3, tz: 'America/New_York', city: 'نیویورک', offset: '-0500'},
    {id: 4, tz: 'Asia/Tokyo', city: 'توکیو', offset: '+0900'},
    {id: 5, tz: 'Europe/Paris', city: 'پاریس', offset: '+0100'},
    {id: 6, tz: 'Australia/Sydney', city: 'سیدنی', offset: '+1100'}
  ],
  nextId: 7
};

// ==================== DOM Elements ====================
const primaryClock = document.getElementById('primaryClock');
const primaryInfo = document.getElementById('primaryInfo');
const primaryDate = document.getElementById('primaryDate');
const timezonesGrid = document.getElementById('timezonesGrid');
const timezoneSelect = document.getElementById('timezoneSelect');
const cityName = document.getElementById('cityName');
const addBtn = document.getElementById('addBtn');
const statsContainer = document.getElementById('statsContainer');

const toggle24h = document.getElementById('toggle24h');
const toggleSeconds = document.getElementById('toggleSeconds');
const toggleDate = document.getElementById('toggleDate');
const toggleOffset = document.getElementById('toggleOffset');
const toggle24hLabel = document.getElementById('toggle24hLabel');
const toggleSecondsLabel = document.getElementById('toggleSecondsLabel');
const toggleDateLabel = document.getElementById('toggleDateLabel');
const toggleOffsetLabel = document.getElementById('toggleOffsetLabel');

// ==================== Timezone List ====================
const allTimezones = [
  'UTC', 'Asia/Tehran', 'Asia/Dubai', 'Asia/Bangkok', 'Asia/Hong_Kong', 'Asia/Tokyo',
  'Asia/Seoul', 'Asia/Shanghai', 'Asia/Singapore', 'Asia/Kolkata', 'Asia/Jakarta',
  'Australia/Sydney', 'Australia/Melbourne', 'Pacific/Auckland',
  'Europe/London', 'Europe/Paris', 'Europe/Berlin', 'Europe/Moscow', 'Europe/Istanbul',
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
  'America/Toronto', 'America/Mexico_City', 'America/Sao_Paulo', 'America/Buenos_Aires',
  'Africa/Cairo', 'Africa/Johannesburg', 'Africa/Lagos'
];

// ==================== Utility Functions ====================
function formatTime(date, is24h, showSeconds) {
  let hours = date.getHours();
  const minutes = String(date.getMinutes()).padStart(2, '0');
  const seconds = String(date.getSeconds()).padStart(2, '0');
  
  let period = '';
  if (!is24h) {
    period = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
  }
  
  hours = String(hours).padStart(2, '0');
  
  let time = `${hours}:${minutes}`;
  if (showSeconds) time += `:${seconds}`;
  
  return {time, period};
}

function formatDate(date) {
  const options = {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'};
  return date.toLocaleDateString('fa-IR', options);
}

function getTimezoneOffset(tzName) {
  const date = new Date();
  const utcDate = new Date(date.toLocaleString('en-US', {timeZone: 'UTC'}));
  const tzDate = new Date(date.toLocaleString('en-US', {timeZone: tzName}));
  const diffMs = tzDate - utcDate;
  const diffMins = diffMs / (1000 * 60);
  const hours = Math.floor(Math.abs(diffMins) / 60);
  const mins = Math.abs(diffMins) % 60;
  const sign = diffMins >= 0 ? '+' : '-';
  return `${sign}${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
}

function getTimezoneTime(tzName) {
  const date = new Date(new Date().toLocaleString('en-US', {timeZone: tzName}));
  return date;
}

// ==================== Update Functions ====================
function updateClocks() {
  // Update primary clock
  const now = new Date();
  const {time, period} = formatTime(now, state.is24h, state.showSeconds);
  
  primaryClock.textContent = time;
  primaryInfo.textContent = state.is24h ? 'UTC' : period;
  
  if (state.showDate) {
    primaryDate.textContent = formatDate(now);
  } else {
    primaryDate.textContent = '';
  }

  // Update timezone cards
  timezonesGrid.innerHTML = '';
  state.timezones.forEach(item => {
    const tzTime = getTimezoneTime(item.tz);
    const {time, period} = formatTime(tzTime, state.is24h, state.showSeconds);
    const date = formatDate(tzTime);
    const offset = getTimezoneOffset(item.tz);

    const card = document.createElement('div');
    card.className = 'timezone-card';
    card.innerHTML = `
      <button class="remove-btn" onclick="removeTimezone(${item.id})">✕</button>
      <div class="timezone-label">منطقه زمانی</div>
      <div class="timezone-city">${item.city}</div>
      <div class="timezone-time">${time}</div>
      <div class="timezone-period">${state.is24h ? offset : period}</div>
      <div class="timezone-details">
        ${state.showDate ? `<span>${date}</span>` : ''}
        ${state.showOffset ? `<span class="tz-offset">${offset}</span>` : ''}
      </div>
    `;
    timezonesGrid.appendChild(card);
  });

  // Update stats
  updateStats();
}

function updateStats() {
  const now = new Date();
  const utcTime = new Date(now.toLocaleString('en-US', {timeZone: 'UTC'}));
  const hours = String(utcTime.getHours()).padStart(2, '0');
  
  statsContainer.innerHTML = `
    <div class="stat-item">
      <div class="stat-value">${state.timezones.length}</div>
      <div class="stat-label">منطقه زمانی</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">${hours}</div>
      <div class="stat-label">ساعت UTC</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">${now.getDay()}</div>
      <div class="stat-label">روز هفته</div>
    </div>
  `;
}

function populateTimezoneSelect() {
  timezoneSelect.innerHTML = '<option value="">انتخاب منطقه زمانی...</option>';
  allTimezones.forEach(tz => {
    const option = document.createElement('option');
    option.value = tz;
    const offset = getTimezoneOffset(tz);
    option.textContent = `${tz} (${offset})`;
    timezoneSelect.appendChild(option);
  });
}

// ==================== Event Handlers ====================
function addTimezone() {
  const tz = timezoneSelect.value;
  const city = cityName.value.trim() || tz.split('/')[1] || tz;

  if (!tz) {
    alert('لطفا منطقه زمانی را انتخاب کنید');
    return;
  }

  if (state.timezones.some(t => t.tz === tz)) {
    alert('این منطقه زمانی قبلا اضافه شده است');
    return;
  }

  const offset = getTimezoneOffset(tz);
  state.timezones.push({
    id: state.nextId++,
    tz,
    city,
    offset
  });

  timezoneSelect.value = '';
  cityName.value = '';
  updateClocks();
}

function removeTimezone(id) {
  state.timezones = state.timezones.filter(t => t.id !== id);
  updateClocks();
}

// Toggle handlers
function setupToggle(element, label, stateKey) {
  element.addEventListener('click', () => {
    state[stateKey] = !state[stateKey];
    element.classList.toggle('active');
    label.textContent = state[stateKey] ? 'فعال' : 'غیرفعال';
    updateClocks();
  });
}

// ==================== Event Listeners ====================
addBtn.addEventListener('click', addTimezone);
timezoneSelect.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') addTimezone();
});
cityName.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') addTimezone();
});

setupToggle(toggle24h, toggle24hLabel, 'is24h');
setupToggle(toggleSeconds, toggleSecondsLabel, 'showSeconds');
setupToggle(toggleDate, toggleDateLabel, 'showDate');
setupToggle(toggleOffset, toggleOffsetLabel, 'showOffset');

// ==================== Init ====================
populateTimezoneSelect();
updateClocks();
setInterval(updateClocks, 500);

console.log('✓ Digital Clock آماده است!');
</script>

</body>
</html>
