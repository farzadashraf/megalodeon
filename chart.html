<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مگالودون | چارت تحلیل تکنیکال</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0806;
    --bg2:#120d09;
    --panel:#17110b;
    --panel2:#1c150e;
    --border:#2c2115;
    --border2:#3a2c1a;
    --gold:#e3a84c;
    --gold2:#f6c877;
    --gold-dim:#8a6a34;
    --text:#f3e9db;
    --muted:#a4917a;
    --muted2:#6e5d47;
    --green:#20d193;
    --green-dim:#123527;
    --red:#f6465d;
    --red-dim:#3a1620;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(ellipse at top left, #1a1108 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
    font-size:13px;
    line-height:1.5;
    display:flex;
  }
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border2); border-radius:8px;}

  /* Header */
  header{
    background:linear-gradient(180deg,var(--panel),#100b07);
    border-bottom:1px solid var(--border);
    padding:12px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .logo{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px;}
  .logo .mark{width:32px; height:32px; background:linear-gradient(145deg,var(--gold2),var(--gold-dim)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:18px;}

  .symbol-selector{display:flex; gap:8px; align-items:center;}
  select{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--gold);
    padding:8px 12px;
    border-radius:6px;
    font-family:inherit;
    cursor:pointer;
  }
  select option{background:var(--bg); color:var(--text);}

  .hud{
    display:flex;
    gap:16px;
    align-items:center;
    padding:0 20px;
    border-right:1px solid var(--border);
  }
  .hud-item{display:flex; flex-direction:column; align-items:center;}
  .hud-label{font-size:11px; color:var(--muted2); text-transform:uppercase; font-weight:600;}
  .hud-value{font-size:16px; font-weight:800; color:var(--gold2); font-family:'JetBrains Mono',monospace;}

  .toolbar{display:flex; gap:8px;}
  .tool-btn{
    background:transparent;
    border:1px solid var(--border2);
    color:var(--muted);
    width:32px;
    height:32px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.15s;
    font-size:14px;
  }
  .tool-btn:hover{border-color:var(--gold); color:var(--gold2);}
  .tool-btn.active{background:linear-gradient(90deg,var(--gold2),var(--gold-dim)); color:#1a1108; border-color:var(--gold);}

  /* Main Container */
  .container{display:flex; flex:1; overflow:hidden;}

  /* Sidebar Left */
  .sidebar-left{
    width:280px;
    background:linear-gradient(180deg,var(--panel),#100b07);
    border-left:1px solid var(--border);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  .panel-header{
    padding:12px;
    border-bottom:1px solid var(--border);
    font-weight:700;
    font-size:12px;
    text-transform:uppercase;
    color:var(--gold2);
  }
  .panel-content{flex:1; overflow-y:auto; padding:12px;}
  .section{margin-bottom:16px;}
  .section-title{font-size:11px; font-weight:800; color:var(--gold2); text-transform:uppercase; margin-bottom:8px; letter-spacing:.5px;}
  .badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:6px;
    font-size:11px;
    font-weight:700;
    margin-bottom:4px;
    width:100%;
    text-align:center;
  }
  .badge.bull{background:var(--green-dim); color:var(--green);}
  .badge.bear{background:var(--red-dim); color:var(--red);}
  .badge.neu{background:transparent; color:var(--muted); border:1px solid var(--border);}

  /* Chart Area */
  .chart-area{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  canvas{
    flex:1;
    background:radial-gradient(ellipse at top left, #1a1108 0%, var(--bg) 55%);
    display:block;
  }

  /* Chart Controls */
  .chart-controls{
    background:var(--panel);
    border-top:1px solid var(--border);
    padding:8px 12px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .tf-btn{
    background:transparent;
    border:1px solid var(--border2);
    color:var(--muted);
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    font-size:11px;
    font-weight:600;
    transition:.15s;
  }
  .tf-btn:hover{border-color:var(--gold); color:var(--gold2);}
  .tf-btn.active{background:linear-gradient(90deg,var(--gold2),var(--gold-dim)); color:#1a1108; border-color:var(--gold);}

  /* Sidebar Right */
  .sidebar-right{
    width:320px;
    background:linear-gradient(180deg,var(--panel),#100b07);
    border-right:1px solid var(--border);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  .ai-body{
    flex:1;
    overflow-y:auto;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .msg{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    font-size:12px;
    line-height:1.6;
    color:var(--text);
  }
  .msg.user{background:linear-gradient(135deg,var(--gold-dim),var(--gold2)); color:#1a1108; border:none;}
  .msg.loading{background:var(--panel2); color:var(--muted); font-style:italic;}
  .msg .tag{display:block; font-weight:700; color:var(--gold2); margin-bottom:4px; font-size:11px;}
  .msg b{color:var(--gold2);}

  .ai-input-area{
    padding:12px;
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
  }
  input[type="text"]{
    flex:1;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
    font-family:inherit;
  }
  input[type="text"]:focus{outline:none; border-color:var(--gold); box-shadow:0 0 8px #e3a84c33;}

  .send-btn{
    background:linear-gradient(90deg,var(--gold2),var(--gold));
    color:#1a1108;
    border:none;
    width:40px;
    height:40px;
    border-radius:6px;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
  }
  .send-btn:hover{filter:brightness(1.08);}

  /* Modals */
  .modal{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#00000088;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
  }
  .modal.open{display:flex;}
  .modal-content{
    background:linear-gradient(135deg,var(--panel2),var(--panel));
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px;
    max-width:400px;
    max-height:80vh;
    overflow-y:auto;
  }
  .modal-title{font-size:18px; font-weight:800; color:var(--gold2); margin-bottom:16px;}
  .modal-item{margin-bottom:16px;}
  .modal-item label{display:block; font-size:12px; color:var(--muted2); margin-bottom:6px; text-transform:uppercase; font-weight:700;}
  .modal-item input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 12px;
    border-radius:6px;
  }

  /* Toast */
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--gold);
    color:#1a1108;
    padding:14px 24px;
    border-radius:8px;
    font-weight:600;
    z-index:2000;
  }

  @media (max-width:1024px){
    .sidebar-left{width:220px;}
    .sidebar-right{width:260px;}
  }
  @media (max-width:768px){
    .sidebar-left{display:none;}
    .sidebar-right{width:100%; position:absolute; right:0; top:0; height:60%; z-index:100;}
    .hud{display:none;}
  }
</style>

  <div class="symbol-selector">

  <div class="modal-content">

<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const aiBody = document.getElementById('aiBody');
const aiInput = document.getElementById('aiInput');
const aiSend = document.getElementById('aiSend');
const symbolSelect = document.getElementById('symbolSelect');

let state = {
  symbol: 'BTCUSDT',
  tf: '1h',
  candles: [],
  dailyCandles: [],
  swings: [],
  swingLabels: {highs:[], lows:[]},
  structure: null,
  atr: 0,
  fvgs: [],
  levels: [],
  htfBias: 'NEUTRAL',
  lastPrice: 0,
  view: {startIdx: 0, endIdx: 50},
  overlays: {fib: null, trend: null, levels: false}
};

// HUD format
function fmt(n) {
  if (!n) return '--';
  if (n > 100) return n.toFixed(0);
  if (n > 1) return n.toFixed(2);
  return n.toFixed(6);
}

// Load candles from Binance
async function loadCandles() {
  try {
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${state.symbol}&interval=${state.tf}&limit=200`);
    const data = await res.json();
    state.candles = data.map(k => ({
      time: k[0],
      open: parseFloat(k[1]),
      high: parseFloat(k[2]),
      low: parseFloat(k[3]),
      close: parseFloat(k[4]),
      volume: parseFloat(k[7])
    }));
    state.lastPrice = state.candles[state.candles.length-1].close;
    state.view.endIdx = Math.min(50, state.candles.length-1);
    
    // Load daily for bias
    if (state.tf !== '1d') {
      const dailyRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${state.symbol}&interval=1d&limit=60`);
      state.dailyCandles = (await dailyRes.json()).map(k => ({
        time: k[0],
        open: parseFloat(k[1]),
        high: parseFloat(k[2]),
        low: parseFloat(k[3]),
        close: parseFloat(k[4]),
        volume: parseFloat(k[7])
      }));
    }
    
    runEngine();
    updateHUD();
    draw();
  } catch (err) {
    console.error('خطا در بارگذاری:', err);
  }
}

// Technical indicators
function ema(closes, period) {
  const k = 2 / (period + 1);
  let emaVal = closes[0];
  return closes.map(close => {
    emaVal = close * k + emaVal * (1 - k);
    return emaVal;
  });
}

function atrSeries(candles, period) {
  const tr = candles.map((c, i) => {
    if (i === 0) return c.high - c.low;
    return Math.max(
      c.high - c.low,
      Math.abs(c.high - candles[i-1].close),
      Math.abs(c.low - candles[i-1].close)
    );
  });
  return ema(tr, period);
}

// Swing detection
function findSwings(candles, lookback) {
  const swings = [];
  for (let i = lookback; i < candles.length - lookback; i++) {
    const isHigh = candles[i].high === Math.max(...candles.slice(i-lookback, i+lookback+1).map(c=>c.high));
    const isLow = candles[i].low === Math.min(...candles.slice(i-lookback, i+lookback+1).map(c=>c.low));
    if (isHigh) swings.push({price: candles[i].high, type: 'high', time: candles[i].time, index: i});
    if (isLow) swings.push({price: candles[i].low, type: 'low', time: candles[i].time, index: i});
  }
  return swings;
}

function labelSwings(swings) {
  const sorted = [...swings].sort((a,b) => a.time - b.time);
  const highs = [], lows = [];
  let lastType = null;
  sorted.forEach(s => {
    if (s.type !== lastType) {
      if (s.type === 'high') highs.push(s);
      else lows.push(s);
      lastType = s.type;
    }
  });
  return {highs, lows};
}

function detectStructureState(highs, lows) {
  if (highs.length < 2 || lows.length < 2) return null;
  const h0 = highs[highs.length-2], h1 = highs[highs.length-1];
  const l0 = lows[lows.length-2], l1 = lows[lows.length-1];
  let trend, event;
  if (h1.price > h0.price && l1.price > l0.price) { trend = 'BULLISH'; event = 'BOS BULLISH'; }
  else if (h1.price < h0.price && l1.price < l0.price) { trend = 'BEARISH'; event = 'BOS BEARISH'; }
  else { trend = 'MIXED'; event = 'CHoCH'; }
  return {trend, event};
}

function findFVGs(candles) {
  const fvgs = [];
  for (let i = 2; i < candles.length; i++) {
    const a = candles[i-2], c = candles[i];
    if (a.high < c.low) fvgs.push({type:'bullish', top:c.low, bottom:a.high, idx:i-1});
    if (a.low > c.high) fvgs.push({type:'bearish', top:a.low, bottom:c.high, idx:i-1});
  }
  fvgs.forEach(f => {
    f.status = 'OPEN';
    for (let j = f.idx+2; j < candles.length; j++) {
      const c = candles[j];
      if (f.type === 'bullish' && c.low <= f.bottom) { f.status = 'FILLED'; break; }
      if (f.type === 'bearish' && c.high >= f.top) { f.status = 'FILLED'; break; }
    }
  });
  return fvgs.filter(f => f.status === 'OPEN').slice(-8);
}

function findLevels(swings, atrVal) {
  const threshold = Math.max(atrVal * 0.6, 0.0001);
  const clusters = [];
  swings.forEach(s => {
    let c = clusters.find(c => Math.abs(c.price - s.price) < threshold);
    if (c) { c.touches++; c.price = (c.price * (c.touches - 1) + s.price) / c.touches; }
    else clusters.push({price: s.price, touches: 1, type: s.type});
  });
  return clusters.filter(c => c.touches >= 2).sort((a,b) => b.touches - a.touches).slice(0, 6);
}

function htfBiasFromDaily(daily) {
  if (daily.length < 55) return 'NEUTRAL';
  const closes = daily.map(c => c.close);
  const e50 = ema(closes, Math.min(50, closes.length - 1));
  const last = closes[closes.length - 1];
  const eLast = e50[e50.length - 1];
  const slope = e50[e50.length - 1] - e50[e50.length - 6];
  if (last > eLast && slope > 0) return 'BULLISH';
  if (last < eLast && slope < 0) return 'BEARISH';
  return 'NEUTRAL';
}

function runEngine() {
  const c = state.candles;
  if (c.length < 20) return;
  const swings = findSwings(c, 3);
  const {highs, lows} = labelSwings(swings);
  const structState = detectStructureState(highs, lows);
  const atrSer = atrSeries(c, 14);
  const atrVal = atrSer[atrSer.length - 1];
  const fvgs = findFVGs(c);
  const levels = findLevels(swings, atrVal);
  const htfBias = htfBiasFromDaily(state.dailyCandles);

  state.swings = swings;
  state.swingLabels = {highs, lows};
  state.structure = structState;
  state.atr = atrVal;
  state.fvgs = fvgs;
  state.levels = levels;
  state.htfBias = htfBias;

  renderBadges();
  updateLevelsList();
  updateFVGList();
}

function renderBadges() {
  const structBadges = document.getElementById('structBadges');
  structBadges.innerHTML = '';
  const biasMap = {BULLISH: ['bull', 'صعودی'], BEARISH: ['bear', 'نزولی'], NEUTRAL: ['neu', 'خنثی']};
  const [bcls, btxt] = biasMap[state.htfBias];
  structBadges.appendChild(mkBadge(bcls, 'HTF: ' + btxt));
  if (state.structure) {
    const t = state.structure.trend;
    const scls = t === 'BULLISH' ? 'bull' : (t === 'BEARISH' ? 'bear' : 'neu');
    structBadges.appendChild(mkBadge(scls, state.structure.event || 'ساختار خنثی'));
  }
  structBadges.appendChild(mkBadge('neu', 'FVG باز: ' + state.fvgs.length));
}

function mkBadge(cls, txt) {
  const d = document.createElement('div');
  d.className = 'badge ' + cls;
  d.textContent = txt;
  return d;
}

function updateLevelsList() {
  const list = document.getElementById('levelsList');
  if (!state.levels.length) {
    list.innerHTML = '<div style="padding:6px; background:var(--panel2); border-radius:4px; color:var(--muted2);">سطح معتبری شناسایی نشد</div>';
    return;
  }
  list.innerHTML = state.levels.map(l => `
    <div style="padding:8px; background:var(--panel2); border-radius:4px; border-right:2px solid ${l.type === 'low' ? '#20d193' : '#f6465d'};">
      <div style="font-weight:700; color:${l.type === 'low' ? '#20d193' : '#f6465d'};">${fmt(l.price)}</div>
      <div style="font-size:10px; color:var(--muted2);">لمس: ${l.touches}x</div>
    </div>
  `).join('');
}

function updateFVGList() {
  const list = document.getElementById('fvgList');
  if (!state.fvgs.length) {
    list.innerHTML = '<div style="padding:6px; background:var(--panel2); border-radius:4px; color:var(--muted2);">FVG باز وجود ندارد</div>';
    return;
  }
  list.innerHTML = state.fvgs.map(f => `
    <div style="padding:8px; background:var(--panel2); border-radius:4px; border-right:2px solid ${f.type === 'bullish' ? '#20d193' : '#f6465d'};">
      <div style="font-weight:700; color:${f.type === 'bullish' ? '#20d193' : '#f6465d'};">${f.type === 'bullish' ? '📈 صعودی' : '📉 نزولی'}</div>
      <div style="font-size:10px; color:var(--muted2);">${fmt(f.bottom)} - ${fmt(f.top)}</div>
    </div>
  `).join('');
}

function updateHUD() {
  document.getElementById('priceHud').textContent = fmt(state.lastPrice);
  const change = state.candles.length > 1 ? 
    ((state.lastPrice - state.candles[state.candles.length-2].close) / state.candles[state.candles.length-2].close * 100) : 0;
  const changeHud = document.getElementById('changeHud');
  changeHud.textContent = (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
  changeHud.style.color = change >= 0 ? '#20d193' : '#f6465d';
  document.getElementById('atrLabel').textContent = fmt(state.atr);
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const c = state.candles;
  if (!c || c.length < 2) return;

  const {startIdx, endIdx} = state.view;
  const slice = c.slice(startIdx, endIdx + 1);
  const n = slice.length;
  const padTop = 16, padBottom = 50, padRight = 60, padLeft = 8;
  const chartH = H - padTop - padBottom;
  const chartW = W - padRight - padLeft;

  let maxP = -Infinity, minP = Infinity;
  slice.forEach(k => { if (k.high > maxP) maxP = k.high; if (k.low < minP) minP = k.low; });
  state.levels.forEach(l => { if (l.price > maxP) maxP = l.price; if (l.price < minP) minP = l.price; });
  const pad = (maxP - minP) * 0.08 || maxP * 0.01;
  maxP += pad; minP -= pad;

  const priceToY = p => padTop + (maxP - p) / (maxP - minP) * chartH;
  const idxToX = i => padLeft + (i + 0.5) / n * chartW;
  const cw = Math.max(1.5, (chartW / n) * 0.62);

  // Grid
  ctx.strokeStyle = '#241a0f'; ctx.lineWidth = 1;
  ctx.font = '10px JetBrains Mono, monospace';
  for (let g = 0; g <= 5; g++) {
    const p = minP + (maxP - minP) * g / 5;
    const y = priceToY(p);
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(W - padRight, y); ctx.stroke();
    ctx.fillStyle = '#7a6a54';
    ctx.textAlign = 'left';
    ctx.fillText(fmt(p), W - padRight + 6, y + 3);
  }

  // Candles
  slice.forEach((k, i) => {
    const x = idxToX(i);
    const up = k.close >= k.open;
    ctx.strokeStyle = ctx.fillStyle = up ? '#20d193' : '#f6465d';
    ctx.beginPath();
    ctx.moveTo(x, priceToY(k.high));
    ctx.lineTo(x, priceToY(k.low));
    ctx.stroke();
    const yO = priceToY(k.open), yC = priceToY(k.close);
    const top = Math.min(yO, yC), h = Math.max(1, Math.abs(yC - yO));
    ctx.fillRect(x - cw / 2, top, cw, h);
  });

  // Volume
  const maxVol = Math.max(...slice.map(k => k.volume), 1);
  const volTop = padTop + chartH - 30;
  slice.forEach((k, i) => {
    const x = idxToX(i);
    const up = k.close >= k.open;
    const h = (k.volume / maxVol) * 25;
    ctx.fillStyle = up ? '#20d19333' : '#f6465d33';
    ctx.fillRect(x - cw / 2, volTop + 30 - h, cw, h);
  });
}

function addMsg(html, cls = '') {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = html;
  aiBody.appendChild(d);
  aiBody.scrollTop = aiBody.scrollHeight;
  return d;
}

// Events
symbolSelect.addEventListener('change', (e) => {
  state.symbol = e.target.value;
  loadCandles();
});

document.querySelectorAll('.tf-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tf = btn.dataset.tf;
    loadCandles();
  });
});

aiSend.addEventListener('click', () => {
  const v = aiInput.value.trim();
  if (!v) return;
  addMsg(v, 'user');
  aiInput.value = '';
  addMsg('<span class="tag">ماموت</span>سلام! من اینجا هستم. این تنها یک نمونه است. صفحه چارت آماده است! 🦖', '');
});

// Init
loadCandles();
setInterval(loadCandles, 5000);
</script>
